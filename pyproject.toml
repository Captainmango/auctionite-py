[project]
name = "auctionite-py"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Edward Heaver", email = "edward.heaver01@gmail.com" }
]
requires-python = ">=3.13"
dependencies = [
    "django>=6.1.2",
    "djangorestframework>=3.18.3",
    "pillow>=13.0.0",
    "psycopg[binary]>=3.2",
]

[tool.pyrefly]
project-includes = [
    "**/*.py*",
    "**/*.ipynb",
]
# "src" holds the Django apps (added to sys.path at runtime by settings),
# "." holds the config package
search-path = ["src", "."]

[tool.ruff.lint]
select = [
    # pycodestyle
    "E",
    # Pyflakes
    "F",
    # isort
    "I",
]

ignore = ["E501"]

[dependency-groups]
dev = [
    "django-stubs>=6.1.2",
    "djangorestframework-stubs>=3.18.2",
    "pyrefly>=1.4.0",
    "python-dotenv>=1.2.4",
    "ruff>=0.17.3",
]
